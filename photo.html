<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photo Studio — Ambioz</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #f7f7f5;
      color: #111;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -0.8px;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: #666;
      font-size: 16px;
      line-height: 1.5;
    }

    .card {
      background: #fff;
      border: 1px solid #e4e4e4;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .ambi-header {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #eee;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 28px;
      font-weight: 600;
      color: #777;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ambi-name {
      font-size: 22px;
      font-weight: 600;
    }

    .ambi-role {
      margin-top: 4px;
      color: #777;
      font-size: 14px;
    }

    .field {
      margin-bottom: 22px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 15px;
      outline: none;
    }

    select:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: 11px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: #f0f0ee;
      color: #111;
    }

    .result {
      display: none;
    }

    .result h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .prompt-label {
      margin-top: 22px;
    }

    .prompt-box {
      width: 100%;
      min-height: 190px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fafaf8;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      white-space: pre-wrap;
    }

    .prompt-actions {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .generation-area {
      display: none;
      margin-top: 22px;
    }

    .generation-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: #f0f0ee;
      border: 1px dashed #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: #777;
      line-height: 1.5;
    }

    .note {
      margin-top: 14px;
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }

    .auto-note {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f5f5f3;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      background: #fff1f1;
      border: 1px solid #eccaca;
      border-radius: 10px;
      color: #a33;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 24px 16px 50px;
      }

      h1 {
        font-size: 28px;
      }

      .card {
        padding: 20px;
      }

      .prompt-actions {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

  <main class="container">

    <a class="back" href="identity.html">
      ← Back to Identity
    </a>

    <h1>Create with your Ambi</h1>

    <p class="subtitle">
      Create a photo with your Ambi.
    </p>


    <!-- AMBI -->

    <section class="card">

      <div class="ambi-header">

        <div class="avatar" id="avatar">
          A
        </div>

        <div>

          <div class="ambi-name" id="ambiName">
            Your Ambi
          </div>

          <div class="ambi-role" id="ambiRole">
            Digital Business Representative
          </div>

        </div>

      </div>

    </section>


    <!-- PHOTO SETTINGS -->

    <section class="card">

      <div class="field">

        <label for="scene">
          Scene
        </label>

        <select id="scene">

          <option value="professional office">
            Professional office
          </option>

          <option value="modern studio">
            Modern studio
          </option>

          <option value="creative workspace">
            Creative workspace
          </option>

          <option value="outdoor">
            Outdoor
          </option>

          <option value="neutral background">
            Neutral background
          </option>

        </select>

      </div>


      <div class="field">

        <label for="pose">
          Pose
        </label>

        <select id="pose">

          <option value="standing">
            Standing
          </option>

          <option value="sitting">
            Sitting
          </option>

          <option value="portrait">
            Portrait
          </option>

          <option value="walking">
            Walking
          </option>

        </select>

      </div>


      <div class="field">

        <label for="expression">
          Expression
        </label>

        <select id="expression">

          <option value="friendly">
            Friendly
          </option>

          <option value="confident">
            Confident
          </option>

          <option value="professional">
            Professional
          </option>

          <option value="warm">
            Warm
          </option>

          <option value="neutral">
            Neutral
          </option>

        </select>

      </div>


      <div class="field">

        <label for="format">
          Format
        </label>

        <select id="format">

          <option value="square">
            Square
          </option>

          <option value="portrait">
            Portrait
          </option>

          <option value="landscape">
            Landscape
          </option>

        </select>

      </div>


      <button
        type="button"
        onclick="createPhoto()"
      >
        Create Photo →
      </button>

      <div class="error" id="error"></div>

    </section>


    <!-- RESULT -->

    <section class="card result" id="result">

      <h2>
        Your Photo
      </h2>


      <div class="prompt-label">

        <label>
          Generation prompt
        </label>

      </div>


      <div
        class="prompt-box"
        id="promptBox"
      ></div>


      <div
        class="auto-note"
        id="autoNote"
      ></div>


      <div class="prompt-actions">

        <button
          type="button"
          class="secondary"
          onclick="copyPrompt()"
        >
          Copy Prompt
        </button>

        <button
          type="button"
          onclick="generateImage()"
        >
          Generate Image →
        </button>

      </div>


      <div
        class="generation-area"
        id="generationArea"
      >

        <div
          class="generation-placeholder"
          id="generationPlaceholder"
        >
          Image generation will be connected here.
        </div>

      </div>


      <div class="note">
        Ambioz uses your Identity and selected photo settings
        to create a consistent visual direction for your Ambi.
      </div>

    </section>

  </main>


  <script>

    const identity =
      JSON.parse(
        localStorage.getItem("ambiIdentity") || "null"
      );


    /*
      Load Identity
    */

    function loadIdentity() {

      if (!identity) {

        showError(
          "No Ambi Identity found. Please create your Ambi first."
        );

        return;
      }


      document.getElementById("ambiName")
        .textContent =
          identity.name || "Your Ambi";


      document.getElementById("ambiRole")
        .textContent =
          identity.role ||
          "Digital Business Representative";


      const avatar =
        document.getElementById("avatar");


      const img =
        document.createElement("img");


      img.src =
        "ambi-avatar.png";


      img.alt =
        identity.name || "Ambi";


      img.onload = function() {

        avatar.innerHTML = "";

        avatar.appendChild(img);

      };

    }


    /*
      Build only explicitly selected
      visual characteristics.
    */

    function buildVisualDescription() {

      if (!identity) {
        return "";
      }


      const parts = [];


      if (identity.gender) {

        parts.push(
          `${identity.gender.toLowerCase()}`
        );

      }


      if (identity.ageRange) {

        parts.push(
          `in their ${identity.ageRange}`
        );

      }


      if (identity.skinTone) {

        parts.push(
          `${identity.skinTone} skin`
        );

      }


      if (identity.hairColor) {

        parts.push(
          `${identity.hairColor} hair`
        );

      }


      if (identity.hairStyle) {

        parts.push(
          identity.hairStyle
        );

      }


      if (identity.eyeColor) {

        parts.push(
          `${identity.eyeColor} eyes`
        );

      }


      if (parts.length === 0) {

        return "a professional person with a natural, attractive appearance";

      }


      return (
        "a professional person with " +
        parts.join(", ")
      );

    }


    /*
      Build prompt
    */

    function buildPrompt() {

      const scene =
        document.getElementById("scene").value;

      const pose =
        document.getElementById("pose").value;

      const expression =
        document.getElementById("expression").value;

      const format =
        document.getElementById("format").value;


      const visualDescription =
        buildVisualDescription();


      let prompt =
        `Create a photorealistic professional business photo of ${visualDescription}. `;


      if (identity && identity.name) {

        prompt +=
          `The character is named ${identity.name}. `;

      }


      if (identity && identity.style) {

        prompt +=
          `Visual style: ${identity.style}. `;

      }


      prompt +=
        `Scene: ${scene}. ` +

        `Pose: ${pose}. ` +

        `Expression: ${expression}. ` +

        `Composition: ${format}. ` +

        `Natural realistic lighting, realistic skin texture, ` +

        `realistic human proportions, natural hands, ` +

        `professional photography, clean composition, ` +

        `premium business environment. ` +

        `The character must have a natural unobstructed head, ` +

        `hair and ears. ` +

        `No headphones, no headset, no microphone, ` +

        `no earbuds, no earpiece, no wires, ` +

        `no communication equipment, no call-center equipment, ` +

        `no telephone equipment, no text, no logos, ` +

        `no watermark, no UI elements.`;


      return prompt;

    }


    /*
      Show which parameters were automatic.
    */

    function updateAutoNote() {

      if (!identity) {
        return;
      }


      const automatic = [];


      if (!identity.gender) {
        automatic.push("gender");
      }

      if (!identity.ageRange) {
        automatic.push("age");
      }

      if (!identity.skinTone) {
        automatic.push("skin tone");
      }

      if (!identity.hairColor) {
        automatic.push("hair color");
      }

      if (!identity.hairStyle) {
        automatic.push("hair style");
      }

      if (!identity.eyeColor) {
        automatic.push("eye color");
      }


      const note =
        document.getElementById("autoNote");


      if (automatic.length === 0) {

        note.style.display = "none";

        return;

      }


      note.style.display = "block";


      note.textContent =
        "Ambioz will choose " +
        automatic.join(", ") +
        " automatically.";

    }


    /*
      Create Photo
    */

    function createPhoto() {

      if (!identity) {

        showError(
          "No Ambi Identity found. Please create your Ambi first."
        );

        return;

      }


      const prompt =
        buildPrompt();


      const request = {

        identity: identity,

        scene:
          document.getElementById("scene").value,

        pose:
          document.getElementById("pose").value,

        expression:
          document.getElementById("expression").value,

        format:
          document.getElementById("format").value,

        prompt:
          prompt,

        createdAt:
          new Date().toISOString()

      };


      localStorage.setItem(
        "ambiPhotoRequest",
        JSON.stringify(request)
      );


      document.getElementById("promptBox")
        .textContent =
          prompt;


      updateAutoNote();


      document.getElementById("result")
        .style.display =
          "block";


      document.getElementById("generationArea")
        .style.display =
          "none";


      document.getElementById("result")
        .scrollIntoView({
          behavior: "smooth"
        });

    }


    /*
      Copy
    */

    async function copyPrompt() {

      const prompt =
        document.getElementById("promptBox")
          .textContent;


      try {

        await navigator.clipboard
          .writeText(prompt);

        const button =
          document.querySelector(
            ".prompt-actions button"
          );


        const original =
          button.textContent;


        button.textContent =
          "Copied ✓";


        setTimeout(function() {

          button.textContent =
            original;

        }, 1500);

      } catch (error) {

        showError(
          "The prompt could not be copied automatically."
        );

      }

    }


    /*
      Temporary generation stage
    */

    function generateImage() {

      const area =
        document.getElementById(
          "generationArea"
        );


      const placeholder =
        document.getElementById(
          "generationPlaceholder"
        );


      area.style.display =
        "block";


      placeholder.innerHTML = `
        <div>
          <strong>Image generator ready</strong>
          <br><br>
          Ambioz has prepared the visual identity
          and photo direction.
          <br><br>
          A real image generation provider
          will be connected here next.
        </div>
      `;


      area.scrollIntoView({
        behavior: "smooth"
      });

    }


    function showError(message) {

      const error =
        document.getElementById("error");


      error.textContent =
        message;


      error.style.display =
        "block";

    }


    loadIdentity();

  </script>

</body>
</html>
