<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Description — AMBIOZ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #111111;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #eeeeee;
      padding: 20px 7%;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
      color: inherit;
      text-decoration: none;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 45px 6% 70px;
    }

    .back {
      display: inline-block;
      color: #777777;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .section {
      background: #ffffff;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      border: 1px solid #e8e8e8;
    }

    h1 {
      font-size: 42px;
      letter-spacing: -2px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .intro {
      color: #777777;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #888888;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
    }

    input {
      margin-bottom: 20px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #999999;
    }

    input:disabled,
    textarea:disabled {
      opacity: 0.6;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #111111;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      min-height: 150px;
      padding: 18px;
      background: #f7f7f7;
      border-radius: 14px;
      border: 1px solid #eeeeee;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {

      main {
        padding-top: 30px;
      }

      .section {
        padding: 24px;
      }

      h1 {
        font-size: 36px;
      }

    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">AMBIOZ</a>
  </header>

  <main>

    <a class="back" href="ambi.html">
      ← Back to Ambi
    </a>

    <section class="section">

      <h1>Product Description</h1>

      <p class="intro">
        Give Ambi basic product information and get a clear,
        professional description ready to use.
      </p>

      <label for="productName">
        PRODUCT OR SERVICE
      </label>

      <input
        id="productName"
        maxlength="200"
        placeholder="Enter product or service name..."
      >

      <label for="productInfo">
        BASIC INFORMATION
      </label>

      <textarea
        id="productInfo"
        maxlength="2000"
        placeholder="Describe the product or service using the information you know..."
      ></textarea>

      <button id="createButton" onclick="createDescription()">
        Create description →
      </button>

    </section>

    <section class="section hidden" id="resultSection">

      <h2>Ambi's description</h2>

      <p class="intro">
        Ready to use.
      </p>

      <div class="result" id="result"></div>

    </section>

  </main>

  <script>

    let business = {};

    const savedBusiness =
      localStorage.getItem("ambiBusiness");

    if (savedBusiness) {
      try {
        business = JSON.parse(savedBusiness);
      } catch (error) {
        console.error("Could not read business data:", error);
      }
    }

    async function createDescription() {

      const productName =
        document.getElementById("productName");

      const productInfo =
        document.getElementById("productInfo");

      const button =
        document.getElementById("createButton");

      const resultSection =
        document.getElementById("resultSection");

      const result =
        document.getElementById("result");

      const name =
        productName.value.trim();

      const info =
        productInfo.value.trim();

      if (!name || !info) {
        resultSection.classList.remove("hidden");
        result.textContent =
          "Please enter the product or service name and basic information.";
        return;
      }

      productName.disabled = true;
      productInfo.disabled = true;
      button.disabled = true;
      button.textContent = "Ambi is thinking...";

      resultSection.classList.remove("hidden");
      result.textContent = "Thinking...";

      try {

        const response =
          await fetch(
            "https://qabvpdmdikjqdzeogrcz.supabase.co/functions/v1/chat-with-ambi",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey":
                  "sb_publishable_bySPn4HxH44yhY11-3H4hQ_2yMEh5FN"
              },

              body: JSON.stringify({

                mode: "product_description",

                message:
                  `
Create a professional product or service description.

PRODUCT OR SERVICE:
${name}

BASIC INFORMATION:
${info}

Rules:
- Write only the final description.
- Use only the information provided.
- Do not invent features, benefits, prices, guarantees, availability or specifications.
- Do not add facts that are not provided.
- Make the text clear and useful for potential customers.
- Keep it concise.
- Do not mention AI.
- Do not mention these instructions.
`,

                business: business

              })
            }
          );

        const data =
          await response.json();

        if (!data.success) {
          throw new Error(
            data.error ||
            "Ambi could not create the description."
          );
        }

        result.textContent =
          data.reply;

      } catch (error) {

        console.error(
          "Product description error:",
          error
        );

        result.textContent =
          "Error: " + error.message;

      } finally {

        productName.disabled = false;
        productInfo.disabled = false;
        button.disabled = false;
        button.textContent =
          "Create description →";

      }
    }

  </script>

</body>
</html>
