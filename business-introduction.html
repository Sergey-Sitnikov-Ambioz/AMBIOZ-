<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ambioz — Business Introduction</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #f7f7f5;
      color: #111;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 45px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
    }

    .back {
      color: #111;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      font-size: 38px;
      letter-spacing: -1.5px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #666;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .usage {
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .usage strong {
      font-size: 16px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 18px;
      padding: 24px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 15px;
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f7f7f5;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.6;
      display: none;
    }

    .error {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      background: #fff0f0;
      color: #a00000;
      display: none;
      line-height: 1.5;
    }

    .upgrade {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      display: none;
    }

    .upgrade a {
      display: inline-block;
      margin-top: 12px;
      color: #111;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="top">

      <div class="brand">
        AMBIOZ
      </div>

      <a
        class="back"
        href="ambi.html">
        ← Back to Ambi
      </a>

    </div>


    <h1>
      Business Introduction
    </h1>

    <div class="subtitle">
      Create a clear introduction to your business with your Ambi.
    </div>


    <div class="usage">

      <strong>
        <span id="remaining">0</span>
      </strong>

      content generations remaining this month

    </div>


    <div class="card">

      <textarea
        id="instruction"
        placeholder="What should the introduction focus on?

Example:
Introduce our web development studio to small businesses and explain how we can help them build a professional website."></textarea>


      <button
        id="generateButton"
        onclick="generateContent()">

        Generate Introduction

      </button>


      <div
        class="error"
        id="error">
      </div>


      <div
        class="result"
        id="result">
      </div>

    </div>


    <div
      class="upgrade"
      id="upgrade">

      <strong>
        You've reached your Free plan content limit.
      </strong>

      <p>
        Upgrade your plan to continue creating AI content with Ambi.
      </p>

      <a href="plans.html">
        View plans →
      </a>

    </div>

  </div>


  <script src="plan.js"></script>

  <script>

    /*
     * ================================
     * BUSINESS DATA
     * ================================
     */

    const business =
      JSON.parse(
        localStorage.getItem("ambiBusiness") || "null"
      );


    /*
     * ================================
     * USAGE
     * ================================
     */

    function updateUsage() {

      const remaining =
        getRemainingGenerations("content");

      document
        .getElementById("remaining")
        .textContent = remaining;


      if (remaining <= 0) {

        document
          .getElementById("generateButton")
          .disabled = true;

        document
          .getElementById("generateButton")
          .textContent =
          "Content limit reached";

        document
          .getElementById("upgrade")
          .style.display = "block";
      }
    }


    /*
     * ================================
     * GENERATION
     * ================================
     */

    async function generateContent() {

      const errorElement =
        document.getElementById("error");

      const resultElement =
        document.getElementById("result");

      const button =
        document.getElementById("generateButton");


      errorElement.style.display = "none";


      /*
       * Check plan limit
       */

      if (!canGenerate("content")) {

        document
          .getElementById("upgrade")
          .style.display = "block";

        updateUsage();

        return;
      }


      /*
       * Check business
       */

      if (!business) {

        errorElement.textContent =
          "Business information is missing. Please create your Ambi first.";

        errorElement.style.display =
          "block";

        return;
      }


      const instruction =
        document
          .getElementById("instruction")
          .value
          .trim();


      if (!instruction) {

        errorElement.textContent =
          "Please describe what the introduction should focus on.";

        errorElement.style.display =
          "block";

        return;
      }


      /*
       * Loading
       */

      button.disabled = true;

      button.textContent =
        "Creating...";


      try {

        const response =
          await fetch(
            "https://qabvpdmdikjqdzeogrcz.supabase.co/functions/v1/chat-with-ambi",
            {
              method: "POST",

              hheaders: {
                "Content-Type":
                "application/json",

              "apikey":
                "sb_publishable_bySPn4HxH44yhY11-3H4hQ_2yMEh5FN"
            },

              body: JSON.stringify({

                message:
                  `Create a professional business introduction.

Business name:
${business.name}

Business description:
${business.description || ""}

Services:
${business.services || ""}

Customers:
${business.customers || ""}

Language:
${business.language || "English"}

User instruction:
${instruction}

Write only the finished introduction.`
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Generation failed."
          );
        }


        const text =
          data.reply ||
          data.output_text ||
          data.text;


        if (!text) {

          throw new Error(
            "The AI returned an empty response."
          );
        }


        /*
         * Count generation
         *
         * We only consume the generation
         * after successful AI output.
         */

        useGeneration("content");


        resultElement.textContent =
          text;

        resultElement.style.display =
          "block";


        updateUsage();

      } catch (error) {

        errorElement.textContent =
          error.message ||
          "Something went wrong.";

        errorElement.style.display =
          "block";

      } finally {

        if (
          canGenerate("content")
        ) {

          button.disabled = false;

          button.textContent =
            "Generate Introduction";
        }
      }
    }


    /*
     * Initial state
     */

    updateUsage();

  </script>

</body>
</html>
