<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Reply — AMBIOZ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #111111;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #eeeeee;
      padding: 20px 7%;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
      color: inherit;
      text-decoration: none;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 45px 6% 70px;
    }

    .back {
      display: inline-block;
      color: #777777;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .section {
      background: #ffffff;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      border: 1px solid #e8e8e8;
    }

    h1 {
      font-size: 42px;
      letter-spacing: -2px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .intro {
      color: #777777;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #888888;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      padding: 15px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #999999;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #111111;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      min-height: 120px;
      padding: 18px;
      background: #f7f7f7;
      border-radius: 14px;
      border: 1px solid #eeeeee;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      main {
        padding-top: 30px;
      }

      .section {
        padding: 24px;
      }

      h1 {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">AMBIOZ</a>
  </header>

  <main>

    <a class="back" href="ambi.html">
      ← Back to Ambi
    </a>

    <section class="section">

      <h1>Customer Reply</h1>

      <p class="intro">
        Give Ambi a customer message and get a professional reply
        based on your business information.
      </p>

      <label for="customerMessage">
        CUSTOMER MESSAGE
      </label>

      <textarea
        id="customerMessage"
        maxlength="2000"
        placeholder="Paste the customer's message here..."
      ></textarea>

      <button id="replyButton" onclick="createReply()">
        Create reply →
      </button>

    </section>

    <section class="section hidden" id="resultSection">

      <h2>Ambi's reply</h2>

      <p class="intro">
        Ready to send to the customer.
      </p>

      <div class="result" id="result"></div>

    </section>

  </main>

  <script>

    let business = {};

    const savedBusiness =
      localStorage.getItem("ambiBusiness");

    if (savedBusiness) {
      business = JSON.parse(savedBusiness);
    }

    async function createReply() {

      const input =
        document.getElementById("customerMessage");

      const button =
        document.getElementById("replyButton");

      const resultSection =
        document.getElementById("resultSection");

      const result =
        document.getElementById("result");

      const customerMessage =
        input.value.trim();

      if (!customerMessage) {
        return;
      }

      button.disabled = true;
      button.textContent = "Ambi is thinking...";
      resultSection.classList.remove("hidden");
      result.textContent = "Thinking...";

      try {

        const response =
          await fetch(
            "https://qabvpdmdikjqdzeogrcz.supabase.co/functions/v1/chat-with-ambi",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "apikey":
                  "sb_publishable_bySPn4HxH44yhY11-3H4hQ_2yMEh5FN"
              },

              body: JSON.stringify({

                message:
                  `
Create a professional reply to this customer message.

CUSTOMER MESSAGE:
${customerMessage}

Rules:
- Write only the reply that the business can send to the customer.
- Be natural, polite and professional.
- Use only information available in the business information.
- Never invent prices, services, availability, opening hours, policies, guarantees or other facts.
- If the customer asks something that the business information does not answer, clearly say that Ambi does not currently have that information.
- Never promise that someone will follow up, contact the customer, check with the team, or respond later unless that capability and information are explicitly provided.
- Never claim that the business has a team, staff, support department or human representative unless this is explicitly stated in the business information.
- Do not pretend that you checked external systems or databases.
- Do not repeat unknown or placeholder-looking business information as if it were meaningful. If a business field appears incomplete or unclear, do not rely on it.
- Do not mention that you are an AI.
- Do not explain your reasoning.
- Return only the final customer reply.
- Use the business name naturally. Never address the customer using the business name.
`,

                business: business

              })
            }
          );

        const data =
          await response.json();

        if (!data.success) {
          throw new Error(
            data.error ||
            "Ambi could not create the reply."
          );
        }

        result.textContent =
          data.reply;

      } catch (error) {

        result.textContent =
          "Error: " + error.message;

        console.error(error);

      }

      button.disabled = false;
      button.textContent = "Create reply →";
    }

  </script>

</body>
</html>
